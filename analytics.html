<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hey Auto Analytics</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🛺</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@600;700;800&family=Anek+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/dash/dash.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">🛺</span>
      <div><b>Hey Auto</b><small>ഹേ ഓട്ടോ · Analytics</small></div>
    </div>
    <div class="live" id="live" title="Players with the game open and unpaused in the last 45 seconds"><i></i><b id="live-n">0</b><span>driving now</span></div>
    <nav class="range" id="range">
      <button data-r="1">Today</button><button data-r="7">7 days</button><button data-r="30">30 days</button><button data-r="all">All time</button>
    </nav>
  </header>

  <main id="app">
    <div class="state" id="state">Loading the meter…</div>
  </main>

  <footer class="foot">
    <span id="updated"></span>
    <a href="./" target="_blank" rel="noopener">Open the game ↗</a>
  </footer>

  <script type="module" src="/src/dash/dash.js"></script>
</body>
</html>
